# Deploys the static frontend to GitHub Pages.
#
# No secrets are passed to this build, deliberately. The output is a static
# bundle: anything injected here is readable by every visitor. The API key lives
# in the Cloudflare Worker (see README) and deploys separately via
# `npm run deploy:worker`.
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Gate the deploy on the suite — a broken optimizer should not reach the domain.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        # VITE_API_BASE is public config, not a secret — it is simply the URL the
        # browser calls. A repo *variable* is its honest home; using a secret here
        # would imply a confidentiality this value cannot have.
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || '/api' }}
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
